<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hrací kostka</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            perspective: 1000px; /* Vytváří prostorový 3D efekt */
        }

        .container {
            background-color: #262626;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 40px;
        }

        /* 3D Scéna pro kostku */
        .scene {
            width: 100px;
            height: 100px;
            margin: 20px auto 50px auto;
            perspective: 400px;
        }

        /* 3D Objekt kostky */
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.3, 1);
            transform: rotateX(-20deg) rotateY(-20deg);
        }

        /* Stěna kostky */
        .cube-face {
            position: absolute;
            width: 100px;
            height: 100px;
            background: linear-gradient(145deg, #333333, #111111);
            border: 1px solid #444;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Růžové svítící číslo */
            color: #ff66cc;
            font-size: 52px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 102, 204, 0.8), 0 0 20px rgba(255, 102, 204, 0.4);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.15);
            user-select: none;
            overflow: hidden;
        }

        /* Lesk na stěně kostky */
        .cube-face::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0));
            border-top-left-radius: 14px;
            border-top-right-radius: 14px;
            pointer-events: none;
        }

        /* Pozice jednotlivých 3D stěn */
        .face-front  { transform: rotateY(0deg) translateZ(50px); }
        .face-back   { transform: rotateY(180deg) translateZ(50px); }
        .face-right  { transform: rotateY(90deg) translateZ(50px); }
        .face-left   { transform: rotateY(-90deg) translateZ(50px); }
        .face-top    { transform: rotateX(90deg) translateZ(50px); }
        .face-bottom { transform: rotateX(-90deg) translateZ(50px); }

        /* Tlačítko */
        button {
            background-color: #ff66cc;
            color: #111;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 102, 204, 0.3);
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #ff85d6;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 102, 204, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: #664457;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hrací kostka</h1>
        
        <div class="scene">
            <div id="cube" class="cube">
                <div class="cube-face face-front" id="face">?</div>
                <div class="cube-face face-back"></div>
                <div class="cube-face face-right"></div>
                <div class="cube-face face-left"></div>
                <div class="cube-face face-top"></div>
                <div class="cube-face face-bottom"></div>
            </div>
        </div>
        
        <button id="rollBtn" onclick="hodKostkou()">Hodit kostkou</button>
    </div>

    <script>
        let currentRotationX = -20;
        let currentRotationY = -20;

        function hodKostkou() {
            let cube = document.getElementById("cube");
            let face = document.getElementById("face");
            let tlacitko = document.getElementById("rollBtn");

            tlacitko.disabled = true;

            // Náhodné rotace ve 3D prostoru pro efekt hodití
            let randomX = Math.floor(Math.random() * 4 + 4) * 360; // Min. 4 plné otočky
            let randomY = Math.floor(Math.random() * 4 + 4) * 360;

            currentRotationX += randomX;
            currentRotationY += randomY;

            // Spuštění 3D otáčení
            cube.style.transform = `rotateX(${currentRotationX}deg) rotateY(${currentRotationY}deg)`;

            // Průběžná změna čísel během rotace
            let pocitadlo = 0;
            let interval = setInterval(() => {
                face.textContent = Math.floor(Math.random() * 6) + 1;
                pocitadlo++;
                if (pocitadlo >= 10) {
                    clearInterval(interval);
                }
            }, 50);

            // Nastavení finálního čísla a obnovení tlačítka
            setTimeout(() => {
                let konecneCislo = Math.floor(Math.random() * 6) + 1;
                face.textContent = konecneCislo;
                tlacitko.disabled = false;
            }, 600);
        }
    </script>

</body>
</html>

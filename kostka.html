<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hrací kostka s fanoušky</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            perspective: 1000px;
            overflow: hidden;
        }

        .container {
            background-color: #262626;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            min-width: 320px;
        }

        h1 {
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Bublina s hláškou fanoušků */
        .cheer-bubble {
            height: 24px;
            color: #ff66cc;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(255, 102, 204, 0.6);
            transition: opacity 0.2s;
        }

        /* Aréna s fanoušky a kostkou */
        .arena {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Fanoušci po stranách */
        .fans {
            display: flex;
            gap: 8px;
            font-size: 32px;
            user-select: none;
        }

        .fan {
            display: inline-block;
            transition: transform 0.2s ease;
        }

        /* Animace skákání fanoušků při hodu */
        .cheering .fan {
            animation: jump 0.4s infinite alternate ease-in-out;
        }

        .cheering .fan:nth-child(2n) {
            animation-delay: 0.1s;
        }

        .cheering .fan:nth-child(3n) {
            animation-delay: 0.2s;
        }

        @keyframes jump {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-15px) scale(1.15) rotate(5deg); }
        }

        /* 3D Scéna pro kostku */
        .scene {
            width: 100px;
            height: 100px;
            perspective: 400px;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.3, 1);
            transform: rotateX(-20deg) rotateY(-20deg);
        }

        .cube-face {
            position: absolute;
            width: 100px;
            height: 100px;
            background: linear-gradient(145deg, #333333, #111111);
            border: 1px solid #444;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff66cc;
            font-size: 52px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 102, 204, 0.8), 0 0 20px rgba(255, 102, 204, 0.4);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.15);
            user-select: none;
            overflow: hidden;
        }

        .cube-face::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0));
            border-top-left-radius: 14px;
            border-top-right-radius: 14px;
            pointer-events: none;
        }

        .face-front  { transform: rotateY(0deg) translateZ(50px); }
        .face-back   { transform: rotateY(180deg) translateZ(50px); }
        .face-right  { transform: rotateY(90deg) translateZ(50px); }
        .face-left   { transform: rotateY(-90deg) translateZ(50px); }
        .face-top    { transform: rotateX(90deg) translateZ(50px); }
        .face-bottom { transform: rotateX(-90deg) translateZ(50px); }

        /* Tlačítko */
        button {
            background-color: #ff66cc;
            color: #111;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 102, 204, 0.3);
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #ff85d6;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 102, 204, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: #664457;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hrací kostka</h1>
        
        <div id="cheerBubble" class="cheer-bubble">Kdo fandí, vyhrává! 🙌</div>

        <div class="arena">
            <!-- Fanoušci vlevo -->
            <div class="fans" id="fansLeft">
                <span class="fan">🥳</span>
                <span class="fan">🙌</span>
            </div>

            <!-- 3D Kostka -->
            <div class="scene">
                <div id="cube" class="cube">
                    <div class="cube-face face-front" id="face">?</div>
                    <div class="cube-face face-back"></div>
                    <div class="cube-face face-right"></div>
                    <div class="cube-face face-left"></div>
                    <div class="cube-face face-top"></div>
                    <div class="cube-face face-bottom"></div>
                </div>
            </div>

            <!-- Fanoušci vpravo -->
            <div class="fans" id="fansRight">
                <span class="fan">👏</span>
                <span class="fan">🤩</span>
            </div>
        </div>
        
        <button id="rollBtn" onclick="hodKostkou()">Hodit kostkou</button>
    </div>

    <script>
        let currentRotationX = -20;
        let currentRotationY = -20;

        const hlaskyBrat = ["Pojďme na to!", "Hoď tam šestku!", "Držíme palce! 🤞", "To dáš! 🔥"];
        const hlaskyKonec = [
            "Skvělý hod! 🎉",
            "Paráda! 👏",
            "Úžasný výsledek! ⭐",
            "Fanoušci šílí! 🥳"
        ];

        function hodKostkou() {
            let cube = document.getElementById("cube");
            let face = document.getElementById("face");
            let tlacitko = document.getElementById("rollBtn");
            let fansLeft = document.getElementById("fansLeft");
            let fansRight = document.getElementById("fansRight");
            let cheerBubble = document.getElementById("cheerBubble");

            tlacitko.disabled = true;

            // Aktivace skákání fanoušků
            fansLeft.classList.add("cheering");
            fansRight.classList.add("cheering");

            // Náhodná povzbudivá hláška
            cheerBubble.textContent = hlaskyBrat[Math.floor(Math.random() * hlaskyBrat.length)];

            // Rotace kostky
            let randomX = Math.floor(Math.random() * 4 + 4) * 360;
            let randomY = Math.floor(Math.random() * 4 + 4) * 360;

            currentRotationX += randomX;
            currentRotationY += randomY;

            cube.style.transform = `rotateX(${currentRotationX}deg) rotateY(${currentRotationY}deg)`;

            // Průběžné střídání čísel
            let pocitadlo = 0;
            let interval = setInterval(() => {
                face.textContent = Math.floor(Math.random() * 6) + 1;
                pocitadlo++;
                if (pocitadlo >= 10) {
                    clearInterval(interval);
                }
            }, 50);

            // Dokončení hodu
            setTimeout(() => {
                let konecneCislo = Math.floor(Math.random() * 6) + 1;
                face.textContent = konecneCislo;

                // Vypnutí skákání
                fansLeft.classList.remove("cheering");
                fansRight.classList.remove("cheering");

                // Finální hláška podle výsledku
                if (konecneCislo === 6) {
                    cheerBubble.textContent = "ŠESTKA! EXTRÁMNÍ RADOST! 💥🎉";
                } else {
                    cheerBubble.textContent = hlaskyKonec[Math.floor(Math.random() * hlaskyKonec.length)];
                }

                tlacitko.disabled = false;
            }, 600);
        }
    </script>

</body>
</html>
